version: 2
updates:
  # Application dependencies (Yarn / npm).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for all non-major bumps to cut noise; majors stay separate.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions pinned in .github/workflows/*.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
