name: CI

on:
  push:
    branches:
      - master
  pull_request:

# Default to read-only; the deploy job opts into id-token for OIDC.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Build static files
        run: yarn build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::322859817636:role/github-actions-deploy
          aws-region: us-west-2

      - name: Deploy static files to S3 bucket
        run: |
          # Root files (index.html, favicon.svg, resume.pdf) are not
          # fingerprinted — must revalidate so new deploys are picked up.
          # assets/* is excluded here so this pass never touches or deletes it.
          # trakt.json and weather.json are written independently by the
          # scheduled poller Lambdas and must survive site deploys.
          aws s3 sync ./dist/ s3://${{ secrets.AWS_S3_BUCKET }} --delete \
            --exclude "assets/*" \
            --exclude "trakt.json" \
            --exclude "weather.json" \
            --cache-control "no-cache"
          # Vite fingerprints everything under assets/ — safe to cache forever.
          aws s3 sync ./dist/assets/ s3://${{ secrets.AWS_S3_BUCKET }}/assets/ --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
