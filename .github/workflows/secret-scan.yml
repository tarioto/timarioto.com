name: Secret Scan

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only fails the build on VERIFIED (live) secrets — high signal, low noise.
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          extra_args: --only-verified --fail
