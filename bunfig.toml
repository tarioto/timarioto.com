[run]
bun = true

[test]
preload = ["./src/test/setup.ts"]
coverage = true
coverageSkipTestFiles = true
# Fail `bun test` (and CI) if coverage of the files tests load drops below this.
coverageThreshold = { lines = 0.95, functions = 0.95 }
coveragePathIgnorePatterns = ["src/test/**", "lambda/mockS3.ts"]
